# Generic golden-signal alert rules for any system whose traces go through the OpenTelemetry
# Collector's spanmetrics connector (and docker_stats for saturation). No service names:
# every rule is per `service_name`, and thresholds are relative to the service's own recent
# baseline where possible. The `service_name` label is what the agent's profile reads.
#
# Baseline = the previous hour, offset by 15m so an ongoing incident does not pollute it.
# Rules that need a baseline stay silent for the first ~75 minutes after a cold start.

groups:
  - name: golden-signals
    interval: 30s
    rules:
      # Errors: share of server/consumer spans with error status.
      - alert: ServiceErrorRateHigh
        expr: |
          (
            sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER", status_code="STATUS_CODE_ERROR"}[5m]))
            /
            sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))
          ) > 0.05
          and
          sum by (service_name) (increase(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER", status_code="STATUS_CODE_ERROR"}[5m])) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service_name }}: {{ $value | humanizePercentage }} of requests failing over 5m"

      # Latency: p95 at least double the service's own baseline, and above a noise floor.
      - alert: ServiceLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])))
          > 2 * histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h] offset 15m)))
          and
          histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: p95 latency {{ $value | printf \"%.0f\" }} ms, over 2x its baseline"

      # Traffic drop: request rate below 20% of baseline, for services that normally get traffic.
      - alert: ServiceTrafficDrop
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))
          < 0.2 * sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h] offset 15m))
          and
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h] offset 15m)) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: request rate dropped below 20% of its baseline"

      # Traffic spike: request rate above 3x the baseline median. Only compared against a
      # baseline with traffic in every minute: after downtime, an average over the gap would
      # make normal traffic look like a spike.
      - alert: ServiceTrafficSpike
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))
          > 3 * quantile_over_time(0.5, (sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])))[1h:1m] offset 15m)
          and
          min_over_time((sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])))[1h:1m] offset 15m) > 0
          and
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: request rate {{ $value | printf \"%.1f\" }}/s, over 3x its baseline"

      # Saturation (memory): above 90% of its limit AND up more than 10 points on its own
      # baseline. The second condition skips containers that always run close to their limit.
      # Assumes container name == service name (true for this demo; adjust per system).
      - alert: ServiceMemorySaturation
        expr: |
          label_replace(
            (
              max by (container_name) (container_memory_usage_total_bytes / container_memory_usage_limit_bytes) > 0.9
            )
            and
            (
              max by (container_name) (container_memory_usage_total_bytes / container_memory_usage_limit_bytes)
              - max by (container_name) (avg_over_time((container_memory_usage_total_bytes / container_memory_usage_limit_bytes)[1h:1m] offset 15m))
            ) > 0.1,
            "service_name", "$1", "container_name", "(.+)"
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: memory at {{ $value | humanizePercentage }} of its limit"
