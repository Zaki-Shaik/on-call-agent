# Changes to OpenTelemetry Demo services needed by the on-call agent.
# Merged after the demo's own compose files (see ../../compose.demo.yaml).
# Relative paths here would resolve against the demo's directory, so our own files are
# referenced through configs defined in compose.demo.yaml.

services:
  # Persist traces on disk (Badger) instead of memory, so incidents can be replayed for eval.
  jaeger:
    command:
      - "--config=file:/etc/jaeger/oncall-config.yml"
    configs:
      - source: jaeger-config
        target: /etc/jaeger/oncall-config.yml
    # Jaeger's image runs as uid 10001 and cannot write to a fresh named volume.
    # Root is acceptable for this local-only setup.
    user: "0:0"
    volumes:
      - jaeger-data:/badger

  # Flag state is runtime data: keep it on a volume, seeded once from the upstream file,
  # instead of letting flagd-ui rewrite the copy in deploy/demo/upstream on every change.
  flagd-init:
    image: busybox:1.37.0
    container_name: flagd-init
    command: ["sh", "-c", "[ -f /data/demo.flagd.json ] || cp /seed/demo.flagd.json /data/"]
    volumes:
      - ./src/flagd:/seed:ro
      - flagd-data:/data
  flagd:
    volumes:
      - flagd-data:/etc/flagd
    depends_on:
      flagd-init: { condition: service_completed_successfully }
  flagd-ui:
    volumes:
      - flagd-data:/app/data
    depends_on:
      flagd-init: { condition: service_completed_successfully }

  # Keep metrics across container recreation (the demo relies on an anonymous volume),
  # and add our alert rules and Alertmanager. Same flags as upstream except --config.file.
  prometheus:
    command:
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --storage.tsdb.retention.time=7d
      - --config.file=/etc/prometheus/oncall/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.route-prefix=/
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    configs:
      - source: prometheus-config
        target: /etc/prometheus/oncall/prometheus.yaml
      - source: golden-signals-rules
        target: /etc/prometheus/oncall/rules/golden-signals.rules.yaml
    volumes:
      - prometheus-data:/prometheus

  # Not part of the upstream demo: routes Prometheus alerts to the agent's webhook.
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.30.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - alertmanager-data:/alertmanager
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped

  # Keep logs across container recreation.
  opensearch:
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  alertmanager-data:
  flagd-data:
  jaeger-data:
  prometheus-data:
  opensearch-data:
